name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes makecode build
      - run: npx --yes makecode build -j
      - run: gh release upload "$TAG" built/binary.js built/n3/binary.hex --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
